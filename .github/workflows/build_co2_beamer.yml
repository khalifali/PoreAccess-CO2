name: Build CO2 Beamer PDFs

on:
  push:
    paths:
      - 'beamer/PoreAccess_CO2_presentation/poreaccess_co2_results.tex'
      - 'beamer/PoreAccess_CO2_presentation/with_notes/poreaccess_co2_results_with_notes.tex'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile audience deck
        working-directory: beamer/PoreAccess_CO2_presentation
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error poreaccess_co2_results.tex
          pdflatex -interaction=nonstopmode -halt-on-error poreaccess_co2_results.tex
      - name: Compile presenter deck
        working-directory: beamer/PoreAccess_CO2_presentation/with_notes
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error poreaccess_co2_results_with_notes.tex
          pdflatex -interaction=nonstopmode -halt-on-error poreaccess_co2_results_with_notes.tex
      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beamer/PoreAccess_CO2_presentation/poreaccess_co2_results.pdf
          git add beamer/PoreAccess_CO2_presentation/with_notes/poreaccess_co2_results_with_notes.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build updated CO2 Beamer PDFs [skip ci]"
            git push
          fi
